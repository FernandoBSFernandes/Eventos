name: Testes

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  unit-tests:
    name: Testes Unitários
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restaurar dependências
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Executar testes unitários
        run: >
          dotnet test Eventos.Tests/Eventos.Tests.csproj
          --no-build
          --configuration Release
          --logger "trx;LogFileName=unit-tests.trx"
          --results-directory ./test-results

      - name: Publicar relatório de testes unitários
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: Relatório — Testes Unitários
          path: ./test-results/unit-tests.trx
          reporter: dotnet-trx

  integration-tests:
    name: Testes de Integração
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: eventos_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restaurar dependências
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Executar testes de integração
        run: >
          dotnet test Eventos.IntegrationTests/Eventos.IntegrationTests.csproj
          --no-build
          --configuration Release
          --logger "trx;LogFileName=integration-tests.trx"
          --results-directory ./test-results
        env:
          ConnectionStrings__DefaultConnection: "Host=localhost;Port=5432;Database=eventos_test;Username=postgres;Password=postgres"

      - name: Publicar relatório de testes de integração
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: Relatório — Testes de Integração
          path: ./test-results/integration-tests.trx
          reporter: dotnet-trx

  performance-tests:
    name: Testes de Performance (k6)
    runs-on: ubuntu-latest
    needs: integration-tests

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: eventos_perf
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restaurar dependências
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Subir aplicação em background
        run: |
          dotnet run --project EventosAPI/EventosAPI.csproj \
            --configuration Release \
            --urls "http://localhost:8080" &
          echo "Aguardando aplicação inicializar..."
          timeout 30 bash -c 'until curl -sf http://localhost:8080/api/convidado/listar; do sleep 1; done'
        env:
          ConnectionStrings__DefaultConnection: "Host=localhost;Port=5432;Database=eventos_perf;Username=postgres;Password=postgres"

      - name: Executar testes k6
        uses: grafana/k6-action@v0.3.1
        with:
          filename: k6/load-test.js
        env:
          BASE_URL: http://localhost:8080

      - name: Publicar relatório HTML do k6
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: relatorio-performance-k6
          path: k6/relatorio.html
          retention-days: 30

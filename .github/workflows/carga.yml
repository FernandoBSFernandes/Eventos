name: Carga

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: ["main"]

permissions:
  contents: read
  checks: write
  actions: read

jobs:
  carga:
    name: Testes de Carga (k6)
    runs-on: ubuntu-latest
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push'
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: eventos_perf
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout do SHA que disparou o CI
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restaurar dependências
        run: dotnet restore

      - name: Publicar API
        run: |
          dotnet publish EventosAPI/EventosAPI.csproj \
            --configuration Release \
            --output ./publish

      - name: Subir API em background
        run: |
          dotnet ./publish/EventosAPI.dll > api.log 2>&1 &
          echo $! > api.pid
          echo "Aguardando API..."
          for i in $(seq 1 60); do
            if curl -sf http://localhost:5000/api/convidado/listar > /dev/null 2>&1; then
              echo "API disponível após $((i * 2))s"
              exit 0
            fi
            sleep 2
          done
          echo "--- LOG DA API ---"
          cat api.log || true
          echo "API não respondeu em 120s"
          exit 1
        env:
          ASPNETCORE_URLS: http://localhost:5000
          ASPNETCORE_ENVIRONMENT: Production
          ConnectionStrings__DefaultConnection: "Host=localhost;Port=5432;Database=eventos_perf;Username=postgres;Password=postgres"
          Evento__LimiteMaximoPessoas: "105"
          Swagger__Enabled: "false"

      - name: Setup k6
        uses: grafana/setup-k6-action@v1

      - name: Executar testes de carga
        uses: grafana/run-k6-action@v1
        with:
          path: k6/performance.js
        env:
          BASE_URL: http://localhost:5000
          K6_NO_COLOR: "true"

      - name: Publicar thresholds no Summary
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: Relatório — Thresholds k6
          path: k6/relatorio-junit.xml
          reporter: java-junit

      - name: Publicar artefatos de carga
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: relatorio-carga-k6
          path: |
            k6/relatorio.html
            k6/relatorio.json
            k6/relatorio-junit.xml
          retention-days: 30

      - name: Exibir log da API
        if: always()
        run: cat api.log || true

      - name: Derrubar API
        if: always()
        run: |
          if [ -f api.pid ]; then
            kill $(cat api.pid) 2>/dev/null || true
          fi

name: CI

on:
  push:
    branches: ["**"]
    paths-ignore:
      - "**.md"
      - ".gitignore"
  pull_request:
    branches: ["main"]
    paths-ignore:
      - "**.md"
      - ".gitignore"

permissions:
  contents: read
  checks: write

jobs:
  ci:
    name: Build, Testes Unitários e Cobertura
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restaurar dependências
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Executar testes unitários com cobertura
        run: |
          dotnet test Eventos.Tests/Eventos.Tests.csproj \
            --no-build \
            --configuration Release \
            --logger "trx;LogFileName=TestResults.trx" \
            --results-directory ./test-results \
            /p:CollectCoverage=true \
            /p:CoverletOutputFormat=opencover \
            /p:CoverletOutput=./coverage.opencover.xml \
            /p:Threshold=80 \
            /p:ThresholdType=line \
            /p:ThresholdStat=total

      - name: Publicar resultados dos testes
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: Relatório — Testes Unitários
          path: ./test-results/TestResults.trx
          reporter: dotnet-trx

      - name: Publicar artefato de cobertura
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cobertura-de-codigo
          path: "**/coverage.opencover.xml"
          retention-days: 30

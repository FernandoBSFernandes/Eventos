name: Qualidade

on:
  push:
    branches: ["**"]
    paths-ignore:
      - "**.md"
      - ".gitignore"
  pull_request:
    branches: ["**"]
    paths-ignore:
      - "**.md"
      - ".gitignore"

permissions:
  contents: read
  checks: write

jobs:

  # ─── Build + Cobertura de código ────────────────────────────────────────────
  qualidade:
    name: Build, Testes e Cobertura (.NET 8)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restaurar dependências
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Executar testes com cobertura
        run: |
          dotnet test Eventos.Tests/Eventos.Tests.csproj \
            --configuration Release \
            --logger "trx;LogFileName=TestResults.trx" \
            /p:CollectCoverage=true \
            /p:CoverletOutputFormat=opencover \
            /p:CoverletOutput=./coverage.opencover.xml \
            /p:Threshold=80 \
            /p:ThresholdType=line \
            /p:ThresholdStat=total

      - name: Publicar resultados dos testes
        uses: EnricoMi/publish-unit-test-result-action@v2
        if: always()
        with:
          files: "**/TestResults.trx"
          check_name: Resultados dos Testes

      - name: Upload do artefato de cobertura
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: "**/coverage.opencover.xml"
          retention-days: 30

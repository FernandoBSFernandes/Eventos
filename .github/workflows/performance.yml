name: Performance

on:
  push:
    branches: ["main"]
    paths-ignore:
      - "**.md"
      - ".gitignore"

permissions:
  contents: read

jobs:

  # ─── Gate: testes unitários devem passar antes do K6 ────────────────────────
  testes-unitarios:
    name: Testes Unitários
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restaurar dependências
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Executar testes unitários
        run: |
          dotnet test Eventos.Tests/Eventos.Tests.csproj \
            --no-build \
            --configuration Release \
            --verbosity minimal

  # ─── Testes de performance com K6 ───────────────────────────────────────────
  k6:
    name: Testes de Performance (K6)
    runs-on: ubuntu-latest
    needs: testes-unitarios

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: db_k6
          POSTGRES_USER: k6_user
          POSTGRES_PASSWORD: k6_pass
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restaurar dependências
        run: dotnet restore

      - name: Publicar API
        run: |
          dotnet publish EventosAPI/EventosAPI.csproj \
            --configuration Release \
            --output ./publish

      - name: Subir API em background
        env:
          ASPNETCORE_URLS: http://localhost:5000
          ASPNETCORE_ENVIRONMENT: Production
          ConnectionStrings__DefaultConnection: "Host=localhost;Port=5432;Database=db_k6;Username=k6_user;Password=k6_pass;SSL Mode=Disable"
          Swagger__Enabled: "false"
          AllowedHosts: "*"
          ASPNETCORE_FORWARDEDHEADERS_ENABLED: "false"
        run: |
          dotnet ./publish/EventosAPI.dll > api.log 2>&1 &
          echo $! > api.pid

      - name: Aguardar API ficar disponível
        run: |
          echo "Aguardando API..."
          for i in $(seq 1 60); do
            if curl -sf http://localhost:5000/api/convidado/listar > /dev/null 2>&1; then
              echo "API disponível após $((i * 2))s"
              exit 0
            fi
            sleep 2
          done
          echo "--- LOG DA API ---"
          cat api.log || true
          echo "API não respondeu em 120s"
          exit 1

      - name: Setup K6
        uses: grafana/setup-k6-action@v1

      - name: Executar testes K6
        uses: grafana/run-k6-action@v1
        with:
          path: k6/performance.js
        env:
          BASE_URL: http://localhost:5000
          K6_NO_COLOR: "true"

      - name: Exibir log da API
        if: always()
        run: cat api.log || true

      - name: Derrubar API
        if: always()
        run: |
          if [ -f api.pid ]; then
            kill $(cat api.pid) 2>/dev/null || true
          fi

services:

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: eventos_perf
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: EventosAPI/Dockerfile
    ports:
      - "5000:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=eventos_perf;Username=postgres;Password=postgres"
      Evento__LimiteMaximoPessoas: "105"
      Swagger__Enabled: "false"
    depends_on:
      postgres:
        condition: service_healthy

  k6:
    image: grafana/k6:latest
    volumes:
      - ./k6:/scripts
    environment:
      BASE_URL: http://api:8080
      K6_NO_COLOR: "true"
    depends_on:
      - api
    profiles:
      - carga
